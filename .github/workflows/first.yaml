#     Inside Dockerfile:

# CMD ["npm", "start"]

# Meaning:

# When container starts:
# run npm start

# Then again:

# npm start
#    ↓
# node index.js
#    ↓
# console.log()  

#
name: Python Docker Build
on: push
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t my-python-app . # then docker run my-python-app to run the container
      - name: Run Docker Container
        run: docker run my-python-app